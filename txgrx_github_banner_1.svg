    <rect x="158" y="161" width="52" height="14" rx="1" fill="#050c05" stroke="#39ff14" stroke-width="0.7"/>
    <text x="184" y="172" class="f" font-size="9" fill="#39ff14" text-anchor="middle">Wireshark</text>
    <rect x="214" y="161" width="30" height="14" rx="1" fill="#050c05" stroke="#39ff14" stroke-width="0.7"/>
