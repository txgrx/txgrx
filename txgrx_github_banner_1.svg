    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.5s" fill="freeze"/>
  </text>
  <text x="424" y="202" class="f" font-size="9" fill="#0a3806" letter-spacing="1">
    CLEARANCE: GRANTED
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.9s" fill="freeze"/>
  </text>
  <text x="534" y="202" class="f" font-size="9" fill="#0a3806">
    |
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.9s" fill="freeze"/>
  </text>
  <text x="544" y="202" class="f" font-size="9" fill="#0a3806" letter-spacing="1">
    VIEWS: MINE
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.9s" fill="freeze"/>
  </text>

  <!-- CRT vignette -->
  <rect x="12" y="12" width="776" height="196" rx="4" fill="none" stroke="#000" stroke-width="6" opacity="0.4"/>

  <!-- Corner markers -->
  <text x="14" y="23" class="f" font-size="8" fill="#0f3808" opacity="0.5">+</text>
  <text x="780" y="23" class="f" font-size="8" fill="#0f3808" opacity="0.5" text-anchor="end">+</text>
  <text x="14" y="209" class="f" font-size="8" fill="#0f3808" opacity="0.5">+</text>
  <text x="780" y="209" class="f" font-size="8" fill="#0f3808" opacity="0.5" text-anchor="end">+</text>

