    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.9s" fill="freeze"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </text>

