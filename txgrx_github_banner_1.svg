    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
  </text>
  <line x1="22" y1="36" x2="398" y2="36" stroke="#1a6010" stroke-width="0.5">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
  </line>

  <!-- Big username with pulse -->
  <text x="22" y="84" class="f" font-size="48" fill="#39ff14" letter-spacing="5" font-weight="bold">
