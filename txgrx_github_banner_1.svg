  </rect>

  <!-- ═══════════════════════════════════ -->
  <!-- LEFT COLUMN -->
  <!-- ═══════════════════════════════════ -->

  <!-- ROBCO header (fade in) -->
  <text x="22" y="31" class="f" font-size="9" fill="#1a6010" letter-spacing="2">
