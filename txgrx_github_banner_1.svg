  </text>
  <text x="432" y="138" class="f" font-size="9" fill="#1a7010" font-style="italic">
    cache invalidation, naming things,
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.1s" fill="freeze"/>
  </text>
  <text x="432" y="150" class="f" font-size="9" fill="#1a7010" font-style="italic">
    and off-by-one errors."
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.1s" fill="freeze"/>
  </text>
  <text x="432" y="163" class="f" font-size="9" fill="#cc8800">
    — a truth universally acknowledged
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.5s" fill="freeze"/>
  </text>

  <!-- Status bar -->
  <line x1="424" y1="177" x2="784" y2="177" stroke="#1a6010" stroke-width="0.5">
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.5s" fill="freeze"/>
  </line>
  <text x="424" y="190" class="f" font-size="9" fill="#0f5008" letter-spacing="1">
